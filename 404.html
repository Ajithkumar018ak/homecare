<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraCare | Error 404 - Connection Broken</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    /* 404 Visual Overhaul styling */
    .bg-deep-navy {
      background: radial-gradient(circle at 50% 50%, #0c1c30 0%, #07111f 100%) !important;
      position: relative;
      overflow: hidden;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      min-height: 100vh !important;
      padding-top: 0 !important;
      padding-bottom: 0 !important;
    }
    
    .bg-deep-navy .container {
      background: rgba(15, 26, 44, 0.45);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      padding: 4rem 3rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      max-width: 700px !important;
      margin: 0 auto;
      text-align: center;
      position: relative;
      z-index: 10;
      animation: cardEntrance 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, floatCard 6s ease-in-out infinite 0.9s;
      transform-style: preserve-3d;
      perspective: 1000px;
      transition: transform 0.1s ease;
    }

    /* Background Glows */
    .bg-glow-circle {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.12;
      pointer-events: none;
      z-index: 1;
      animation: pulseGlow 8s ease-in-out infinite;
    }
    .bg-glow-1 {
      width: 400px;
      height: 400px;
      background: var(--color-primary);
      top: 10%;
      left: 15%;
    }
    .bg-glow-2 {
      width: 350px;
      height: 350px;
      background: var(--color-danger);
      bottom: 10%;
      right: 15%;
      animation-delay: -4s;
    }

    /* SVG ECG line drawing & rotate animations */
    .bg-deep-navy svg {
      filter: drop-shadow(0 0 12px rgba(239, 68, 68, 0.45));
      animation: svgPulse 3.5s ease-in-out infinite;
    }
    .bg-deep-navy svg circle {
      stroke: rgba(255, 255, 255, 0.1);
      stroke-dasharray: 282.7;
      transform-origin: 50px 50px;
      animation: rotateCircle 12s linear infinite;
    }
    .bg-deep-navy svg path:nth-of-type(1) {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: drawECG 4s linear infinite;
    }
    .bg-deep-navy svg path:nth-of-type(2) {
      transform-origin: 50px 50px;
      animation: crossPulse 2.2s ease-in-out infinite;
    }

    /* Entrance text animations */
    .bg-deep-navy h1 {
      animation: textScale 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: scale(0.85);
    }
    .bg-deep-navy h2 {
      animation: textSlideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
      opacity: 0;
      transform: translateY(20px);
    }
    .bg-deep-navy p {
      animation: textFadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
      opacity: 0;
      transform: translateY(20px);
    }
    .bg-deep-navy .reveal.delay-300 {
      animation: buttonsEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.45s forwards;
      opacity: 0;
      transform: translateY(15px);
    }

    /* Buttons improvements */
    .bg-deep-navy .btn-primary {
      background: linear-gradient(135deg, var(--color-primary), #004ecc) !important;
      border: none !important;
      box-shadow: 0 4px 15px rgba(0, 102, 255, 0.3) !important;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1) !important;
      position: relative;
      overflow: hidden;
    }
    .bg-deep-navy .btn-primary:hover {
      transform: translateY(-3px) !important;
      box-shadow: 0 8px 25px rgba(0, 102, 255, 0.5) !important;
    }
    .bg-deep-navy .btn-outline-light {
      background: rgba(255, 255, 255, 0.03) !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
      backdrop-filter: blur(5px);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1) !important;
    }
    .bg-deep-navy .btn-outline-light:hover {
      background: rgba(255, 255, 255, 0.1) !important;
      border-color: rgba(255, 255, 255, 0.3) !important;
      transform: translateY(-2px) !important;
    }

    /* Particle float animation */
    @keyframes floatParticle {
      0%, 100% {
        transform: translate(0, 0) rotate(0deg);
      }
      33% {
        transform: translate(30px, -50px) rotate(120deg);
      }
      66% {
        transform: translate(-30px, -20px) rotate(240deg);
      }
    }

    @keyframes cardEntrance {
      0% {
        opacity: 0;
        transform: scale(0.85) translateY(40px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }
    @keyframes floatCard {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-12px);
      }
    }
    @keyframes pulseGlow {
      0%, 100% {
        transform: scale(1) translate(0, 0);
        opacity: 0.12;
      }
      50% {
        transform: scale(1.2) translate(30px, -20px);
        opacity: 0.18;
      }
    }
    @keyframes svgPulse {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 0 10px rgba(239, 68, 68, 0.4));
      }
      50% {
        transform: scale(1.05);
        filter: drop-shadow(0 0 20px rgba(239, 68, 68, 0.7));
      }
    }
    @keyframes rotateCircle {
      100% {
        transform: rotate(360deg);
      }
    }
    @keyframes drawECG {
      0% {
        stroke-dashoffset: 1000;
      }
      40%, 100% {
        stroke-dashoffset: 0;
      }
    }
    @keyframes crossPulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.9;
      }
      50% {
        transform: scale(1.15);
        opacity: 1;
      }
    }
    @keyframes textScale {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
    @keyframes textSlideUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @keyframes textFadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @keyframes buttonsEntrance {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Accessibility standard respects prefers-reduced-motion */
    @media (prefers-reduced-motion: reduce) {
      .bg-deep-navy .container {
        animation: none !important;
        transform: none !important;
      }
      .bg-deep-navy svg circle,
      .bg-deep-navy svg path,
      .bg-deep-navy svg {
        animation: none !important;
      }
      .bg-deep-navy h1,
      .bg-deep-navy h2,
      .bg-deep-navy p,
      .bg-deep-navy .reveal.delay-300 {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
    }
  </style>
</head>

<body style="overflow-y: hidden;">



  <main>
    <section class="section bg-deep-navy"
      style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding-top: 12rem;">
      <div class="container" style="text-align: center; max-width: 600px;">
        <div style="margin-bottom: 3rem; display: inline-flex; justify-content: center;">
          <svg class="reveal scale-up" width="120" height="120" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="45" fill="none" stroke="rgba(239, 68, 68, 0.15)" stroke-width="2" />
            <path d="M15 50 h25 l5 -15 l5 30 l5 -40 l5 25 l3 -5 h22" fill="none" stroke="var(--color-danger)"
              stroke-width="3" style="stroke-linecap: round; stroke-linejoin: round;" />
            <path d="M50 42v16 M42 50h16" fill="none" stroke="var(--color-danger)" stroke-width="4"
              stroke-linecap="round" />
          </svg>
        </div>
        <h1 style="font-size: 5rem; font-weight: 800; color: white; line-height: 1; margin-bottom: 1.5rem;"
          class="reveal">404</h1>
        <h2 style="font-size: 1.8rem; font-weight: 600; color: white; margin-bottom: 2rem;" class="reveal delay-100">
          Operational Connection Broken</h2>
        <p style="color: var(--text-muted-light); font-size: 1.1rem; line-height: 1.7; margin-bottom: 3.5rem;"
          class="reveal delay-200">
          The requested page coordinates do not exist inside AuraCare’s active telemetry dashboard grid. Let’s redirect
          you back to active services.
        </p>
        <div class="reveal delay-300" style="display: flex; justify-content: center; gap: 1.5rem; flex-wrap: wrap;">
          <a href="index.html" class="btn btn-primary ripple">Redirect to Homepage</a>
          <a href="contact.html" class="btn btn-outline-light">Contact Dispatcher</a>
        </div>
      </div>
    </section>
  </main>



  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const section = document.querySelector('.bg-deep-navy');
      const card = section.querySelector('.container');
      
      // Inject background glows
      const glow1 = document.createElement('div');
      glow1.className = 'bg-glow-circle bg-glow-1';
      const glow2 = document.createElement('div');
      glow2.className = 'bg-glow-circle bg-glow-2';
      section.appendChild(glow1);
      section.appendChild(glow2);

      // Mouse Spotlight Glow Follower
      const spotlight = document.createElement('div');
      spotlight.style.position = 'absolute';
      spotlight.style.width = '600px';
      spotlight.style.height = '600px';
      spotlight.style.borderRadius = '50%';
      spotlight.style.background = 'radial-gradient(circle, rgba(0,102,255,0.06) 0%, transparent 70%)';
      spotlight.style.pointerEvents = 'none';
      spotlight.style.transform = 'translate(-50%, -50%)';
      spotlight.style.zIndex = '2';
      spotlight.style.transition = 'opacity 0.5s ease';
      spotlight.style.opacity = '0';
      section.appendChild(spotlight);

      section.addEventListener('mouseenter', () => spotlight.style.opacity = '1');
      section.addEventListener('mouseleave', () => {
        spotlight.style.opacity = '0';
        card.style.transform = 'rotateX(0deg) rotateY(0deg) translateY(0px)';
      });

      section.addEventListener('mousemove', (e) => {
        const rect = section.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        spotlight.style.left = `${x}px`;
        spotlight.style.top = `${y}px`;

        // 3D Tilt calculation
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        const cardRect = card.getBoundingClientRect();
        const cardX = cardRect.left + cardRect.width / 2;
        const cardY = cardRect.top + cardRect.height / 2;
        const rotateX = -(e.clientY - cardY) / 35;
        const rotateY = (e.clientX - cardX) / 35;
        
        card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-8px)`;
      });

      // Spawn light particles and medical plus signs
      const particleCount = 18;
      for (let i = 0; i < particleCount; i++) {
        const p = document.createElement('div');
        const isPlus = Math.random() > 0.5;
        p.className = isPlus ? 'fa-solid fa-plus' : '';
        if (!isPlus) {
          p.style.width = '4px';
          p.style.height = '4px';
          p.style.borderRadius = '50%';
          p.style.background = Math.random() > 0.5 ? 'var(--color-primary)' : 'var(--color-accent)';
        } else {
          p.style.color = 'rgba(255,255,255,0.06)';
          p.style.fontSize = `${Math.random() * 8 + 8}px`;
        }
        
        p.style.position = 'absolute';
        p.style.left = `${Math.random() * 100}%`;
        p.style.top = `${Math.random() * 100}%`;
        p.style.opacity = Math.random() * 0.4 + 0.1;
        p.style.pointerEvents = 'none';
        p.style.zIndex = '3';
        
        // Random floating animation
        p.style.animation = `floatParticle ${Math.random() * 10 + 8}s ease-in-out infinite`;
        p.style.animationDelay = `${Math.random() * -10}s`;
        
        section.appendChild(p);
      }
    });
  </script>
</body>

</html>
